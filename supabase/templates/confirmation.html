<h2 style="font-family: Georgia, serif; color: #13204a">Confirm your email</h2>
<p style="font-family: sans-serif; color: #13204a">
  Thanks for creating a W&amp;S Engineering account. Confirm your email to place order requests.
</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next={{ .RedirectTo }}"
    style="display: inline-block; background: #13204a; color: #f6efe0; padding: 12px 20px; border-radius: 8px; font-family: sans-serif; text-decoration: none"
    >Confirm email</a
  >
</p>
<p style="font-family: sans-serif; color: #13204a; font-size: 13px">If you didn’t sign up, you can ignore this email.</p>
